[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simovi-mcp"
version = "0.1.0"
description = "Conversational access to mobility data and socio-technical knowledge"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=4.0.2,<5",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
simovi-mcp = "simovi_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simovi_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
